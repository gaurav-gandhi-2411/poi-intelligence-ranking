# Ranking-model hyperparameters for poi-intelligence-ranking Phase 4b (baselines 1-6)
# and later phases (LambdaMART/IPS/calibration, spec.md section 8). Mirrors the
# codebase's established one-typed-config-per-phase convention (configs/features.yaml's
# `candidates` section is the direct precedent) rather than inventing ad hoc constants
# in code. Unlike `candidates/`, spec.md section 14 lists `model.yaml` as its OWN
# top-level file -- honored literally since this is the first phase that needs it.

seed: 42

baselines:
  content_cosine:
    # Baseline 4 (spec.md section 8): "content cosine (explicit interests only)" --
    # a weighted blend of interest-overlap coverage
    # (features.traveler_features.interest_match_score, reused directly) and
    # budget/price fit (features.traveler_features.price_gap, reused directly, gap
    # normalized to [0, 1] by dividing by the max possible 1-4 price-level gap of 3).
    # Arbitrary-but-stated weights, not tuned against any eval metric -- see
    # docs/DATA_CARD.md.
    interest_weight: 0.7
    price_fit_weight: 0.3
  item_knn_cf:
    # Baseline 5 (spec.md section 8): for a cold-start traveler with no as-of-safe
    # positively-engaged history, the item-item kNN score is undefined for every
    # candidate -- falls back to the destination popularity percentile
    # (`num_pop_pct`) rather than crashing or returning an all-zero (meaningless)
    # ranking. Documented, not a silent default.
    cf_score_missing_fallback: popularity
  logistic_regression:
    # Baseline 6 (spec.md section 8): plain pointwise sklearn LogisticRegression on
    # the full feature set, predicting P(label >= 1). scikit-learn defaults except
    # a raised max_iter (the ~280-column one-hot-expanded design matrix needs more
    # than sklearn's default 100 lbfgs iterations to converge cleanly).
    max_iter: 2000
    C: 1.0 # fallback only; the CV grid below is what is used
    # S2: L2 strength chosen by trip-grouped 3-fold CV log-loss on a 20% trip subsample
    # (models/baselines.py::select_l2_strength). The original unregularised C=1.0 fit 308
    # standardised columns on ~1.5k trips -- a possible straw-man baseline.
    c_grid: [0.001, 0.01, 0.1, 1.0]
    cv_folds: 3
    cv_trip_fraction: 0.2

lambdamart:
  # Systems 7/8 (spec.md section 8): LightGBM `objective="lambdarank"`, grouped by
  # trip_id. Reasonable, standard hyperparameters for ~95k fit-split rows / ~250
  # features -- not tuned against the holdout metric (see docs/DATA_CARD.md; tuning
  # to inflate NDCG past what candidate_recall@250's ~0.44 ceiling supports is
  # explicitly out of scope).
  # H3 (results/experiments/h/h3_group_tuning.json, h3b_combinations.json; validation only, 4 seeds):
  # 15 leaves beat 31 on the corrected frames (+0.008 val IPS-NDCG@10 with the cross features).
  num_leaves: 15
  # A4 (scripts/a4_lgbm_bench.py, train-carved validation NDCG@10, two seeds): lr 0.1 + max_bin 63
  # fit in 10.6-16.1 s vs 17.6-22.2 s for lr 0.05 + max_bin 255 at equal-or-better val NDCG@10
  # (0.5727/0.5828 vs 0.5713/0.5811). lr 0.15 was faster still but lost ~0.004 NDCG.
  learning_rate: 0.1
  max_bin: 63
  # Upper bound on boosting rounds -- early stopping on the train-carved validation
  # split (below) almost always halts well before this.
  n_estimators: 1000
  early_stopping_rounds: 50
  lambdarank_truncation_level: 20 # spec.md section 8, verbatim
  eval_ndcg_at: [10] # early-stopping metric: NDCG@10, the same k the whole harness reports on
  # (2^label - 1) exponential gain for labels 0-3, matching dcg_at_k
  # (eval/metrics.py, resolved ambiguity #39) exactly, so training objective and
  # reported metric use the identical gain function.
  # H3 (validation only): a LINEAR training gain beat the exponential one (+0.004 val IPS-NDCG@10 on top
  # of 15 leaves). This deliberately decouples the training gain from the reported metric's gain.
  label_gain: [0, 1, 2, 3]
  min_data_in_leaf: 20
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  # CPU determinism (LightGBM docs: `deterministic: true` requires single-threaded
  # or `force_row_wise`/`force_col_wise` -- hardcoded alongside `deterministic` in
  # lambdamart.py, not duplicated here). See docs/DATA_CARD.md.
  num_threads: 16 # deterministic=True makes the fit thread-count invariant (tests/test_lambdamart.py)
  # Validation split carved from TRAIN ONLY (never the holdout being reported on --
  # that would be leakage into the reported metric), by trip_id, for early stopping.
  val_fraction: 0.15
  val_split_seed: 43 # distinct from the top-level seed: an independent RNG stream, not reused
  # IPS training-weight clipping (spec.md section 8, system 8): w_i = clip(1/p_expose_i, 1, 20)
  ips_clip_low: 1.0
  ips_clip_high: 20.0
  # New-POI robustness (spec.md section 8): fraction of TRAINING rows whose entire
  # behav_* feature block is masked to NaN, independently per row.
  behavioral_dropout_rate: 0.15
  behavioral_dropout_seed: 44 # distinct from val_split_seed: an independent RNG stream
