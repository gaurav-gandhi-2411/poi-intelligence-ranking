# Data-prep / feature-engineering hyperparameters for poi-intelligence-ranking Phase 2
# (`src/poi_rank/data/**`). Mirrors configs/datagen.yaml's convention: every stochastic
# or tunable knob in data/ is sourced from this file, never hardcoded in code.

seed: 42 # independent RNG stream for the synthetic transit-node graph (data/geo_prep.py)

dedup:
  h3_resolution: 8
  name_similarity_threshold: 88 # rapidfuzz token_set_ratio, spec.md section 4
  max_distance_m: 50.0

localness:
  # spec.md section 4 literally states 0.35/0.30/0.20/0.15. Reweighted here after a
  # genuine validation attempt (see docs/DATA_CARD.md "Localness index weight
  # reweighting"): `eval/oracle.py`'s Spearman-rho validation showed
  # `dist_to_tourist_centroid_km` and `local_tag_hits` carry very little marginal
  # signal for this DGP realization (component-level rho ~0.01 and ~0.05
  # respectively -- POI lat/lon jitter is generated independent of latent
  # localness), while `foreign_review_ratio` is by far the strongest single proxy
  # (component-level rho ~0.50). Weight tuning + "is local_tag_hits actually
  # informative" is exactly the iteration spec.md section 4 invites -- this is *not*
  # a fit against oracle values (no code here or in data/localness.py ever reads
  # `_oracle/`; only the diagnostic validation step in `eval/oracle.py` did, as
  # intended). Even after this honest reweighting the achieved rho (~0.48, printed
  # by `eval/oracle.py`) does not clear the spec.md target of 0.6 -- reported
  # honestly rather than tuned further or silently lowered, per spec.md's own
  # instruction not to hide a missed target.
  weight_popularity: 0.20 # z(-pop_pct)
  weight_foreign: 0.60 # z(-foreign_review_ratio)
  weight_geo: 0.10 # z(haversine_to_tourist_centroid)
  weight_tag: 0.10 # z(local_tag_hits)
  tourist_centroid_top_decile: 0.10 # top-decile-by-pop_pct POIs define the tourist centroid

geo:
  transit_nodes_per_destination: 15
  # Std-dev (degrees) of the synthetic transit-node scatter around each destination's
  # actual POI centroid -- see docs/DATA_CARD.md for why this is synthesized at the
  # prep stage rather than in datagen/.
  transit_node_spread_deg: 0.05

# --- Phase 3 (src/poi_rank/features/**) -------------------------------------------
# Feature-engineering hyperparameters: POI text representation, POI feature-table
# knobs, and traveler feature-table knobs (spec.md sections 5-6). Reuses the
# top-level `seed` above for every stochastic step in features/ (TF-IDF/SVD,
# traveler-segment K-Means) -- a separate `poi_rank.features.config.FeatureBuildConfig`
# loader reads this file independently of Phase 2's `data.config.FeaturesConfig`
# (see docs/DATA_CARD.md), mirroring the codebase's one-typed-config-per-phase
# convention rather than coupling phases' config classes to each other.

text_embedding:
  # Canonical default for `make reproduce`: TF-IDF -> SVD-64 (deterministic, no
  # model download, sub-second on 1.5k POIs). "sentence_transformers" is an optional,
  # explicit opt-in (`uv sync --extra text`) -- never a silent runtime fallback. See
  # docs/DATA_CARD.md "Text embedding: TF-IDF is the canonical default path".
  method: tfidf
  svd_dim: 64
  tfidf_max_features: 20000
  tfidf_ngram_max: 2
  sentence_transformer_model: all-MiniLM-L6-v2
  # Committed cache of the FINAL L2-normalized (post-SVD) embedding matrix -- see
  # docs/DATA_CARD.md for why this caches post-SVD rather than the spec's literal
  # "384d pre-SVD" description.
  cache_path: artifacts/poi_emb.npy

poi_features:
  # Bayesian/Laplace smoothing pseudo-count for CTR: smoothed = (n_pos + alpha *
  # global_ctr) / (n_impressions + alpha) -- same empirical-Bayes shape as Phase 2's
  # rating shrinkage (data/shrinkage.py), pulling low-impression POIs' CTR toward the
  # catalog-wide mean rather than letting a 1-impression/1-click POI show CTR=1.0.
  ctr_smoothing_alpha: 5.0
  density_radius_km: 0.5
  # K for the observable traveler-segment K-Means proxy used by the "archetype
  # affinity profile" behavioral feature -- set to 8 to mirror the DGP's 8-archetype
  # count as a structurally reasonable K, NOT because it reads the DGP's archetype
  # definitions or latent assignments (it doesn't -- see docs/DATA_CARD.md).
  traveler_segment_clusters: 8

traveler_features:
  # spec.md section 6 writes `tau = 180 days half-life` then `exp(-delta_t/tau)`.
  # Taken as a literal mathematical half-life (decay = 0.5 at delta_t=180 days), so
  # the exponential's actual decay constant is `180 / ln(2) ~= 259.7` days, not 180 --
  # see docs/DATA_CARD.md for the resolved ambiguity.
  taste_halflife_days: 180.0
  taste_weights:
    booking: 1.0
    visit: 1.0
    navigate: 0.7
    save: 0.6
    share: 0.5
    click: 0.2
    view: 0.05
    dismiss: -0.8
  confidence_shrinkage_k: 5.0
  # Independently authored, NOT imported from `datagen/utility.py`'s latent
  # `BUDGET_TARGET_PRICE_LEVEL` -- same-purpose constant, deliberately separate code,
  # per docs/DATA_CARD.md resolved ambiguity #2 (party_fit/price_fit/novelty_t are
  # latent-only and never shared with observable code).
  budget_target_price_level:
    low: 1.5
    medium: 2.5
    high: 3.5

# --- Phase 4a (src/poi_rank/candidates/**) -----------------------------------------
# Candidate-generation channel quotas + thresholds (spec.md section 7). No dedicated
# `configs/candidates.yaml` exists in spec.md's repository layout (section 14 lists
# exactly datagen/features/model/scoring/eval.yaml) -- mirrors the established
# one-typed-config-per-phase convention already used twice in this same file
# (data.config.FeaturesConfig and features.config.FeatureBuildConfig both read their
# own section of THIS file) rather than inventing a new yaml spec.md never asked for.
# Reuses the top-level `seed` above; the long-tail channel's epsilon-greedy sampling
# is additionally seeded per-trip via a SHA256 digest of `(seed, trip_id)` -- never
# Python's built-in `hash()`, which is only deterministic across runs when
# PYTHONHASHSEED is externally fixed. See docs/DATA_CARD.md.
candidates:
  # A3 (results/parts/a3_retriever_grid.json): with the learned retriever below, the union
  # of {learned, longtail, interest} was the best oracle-free-validation lift among the
  # subsets tried; geo/semantic/cf/archetype quotas are set to 0 (channel disabled, its
  # membership column stays all-False). Spec.md section 7's own rule: a channel with ~0
  # marginal recall gets deleted -- measured marginals in the grid, not asserted.
  geo:
    quota: 0
    # MUST match `dedup.h3_resolution` above -- `pois_prepared.parquet`'s `h3_cell`
    # column (consumed here) is built at that resolution; k-ring cell-id comparisons
    # are only meaningful when both sides use the same resolution.
    h3_resolution: 8
    radius_km_walk: 2.0
    radius_km_public_transport: 8.0
    radius_km_car: 25.0
    # spec.md leaves "mixed" mobility's radius undefined ("use your judgment, e.g.
    # max of transit/car"). Documented choice: equal to `car`'s radius -- "mixed"
    # mobility means the traveler has access to the most permissive mode available,
    # not an average of modes. See docs/DATA_CARD.md.
    radius_km_mixed: 25.0
  interest:
    quota: 50
  semantic:
    quota: 0
  collaborative:
    quota: 0
    # Per-seed-POI neighbor-list size for the item-item kNN lookup (spec.md section
    # 7's "item-item kNN"), not the final channel quota -- see docs/DATA_CARD.md.
    top_k_neighbors: 100
  longtail:
    quota: 50 # HARD FLOOR -- never backfilled by other channels, spec.md section 7.
    # `pois_prepared.pop_pct` is a [0, 1] within-destination percentile
    # (data/popularity.py), not a literal 0-100 scale -- spec.md's "pop_pct < 40" is
    # read as "< 40th percentile" i.e. 0.40 on this dataset's actual scale. See
    # docs/DATA_CARD.md.
    pop_pct_cutoff: 0.40
    # Documented threshold: any non-negative semantic relevance to the traveler's
    # taste vector qualifies (a genuine floor, not a high bar) -- see
    # docs/DATA_CARD.md for the cold-start fallback when the taste vector is zero.
    semantic_sim_threshold: 0.0
    # Fraction of the long-tail quota filled by uniform-random draw from the
    # qualifying pool (exploration); the remainder is filled by semantic-score rank
    # (exploitation). Documented choice -- see docs/DATA_CARD.md.
    epsilon: 0.30
  archetype:
    quota: 0
  learned:
    # Learned first-stage retriever over the FULL destination catalog (candidates/retriever.py):
    # IPS-weighted LightGBM on observable pair features, cross-fitted by trip for train trips.
    # E4 (results/parts/e4_k_sweep.json): PRE-REGISTERED blind rule -- smallest K whose IPS-weighted
    # VALIDATION recall >= 0.93, applied once. Replaces the earlier K=210, whose 0.90 margin had been
    # set after seeing the validation-vs-holdout gap. RE-APPLIED after the as-of-cutoff fix
    # (docs/experiments/H-ranker-cross-features.md, Amendments 1-2): on the corrected features the
    # recall rule alone gives K=270 (validation recall 0.937) but that violates the BLOCKING Gate-B
    # lift row already on validation (val lift 0.332 < 0.35), so K = the largest grid K whose
    # validation lift >= 0.36 (gate 0.35 + 0.01 margin) = 240 (val recall 0.915, val lift 0.363).
    # (First-grid numbers; the committed grid, recomputed on the final candidates.parquet, gives val
    # recall 0.911 / lift 0.358 at 240 and lift 0.327 at 270 -- see DR13. K was not re-selected.)
    quota: 240
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    n_folds: 5
    ips_clip_min: 0.05
    num_threads: 16
