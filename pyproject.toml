[project]
name = "poi-rank"
version = "0.1.0"
description = "Personalized POI intelligence & ranking system with non-circular synthetic evaluation"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.1,<2.3",
    "pyarrow>=15.0,<17.0",
    "scikit-learn>=1.4,<1.6",
    "lightgbm>=4.3,<4.6",
    "shap>=0.45,<0.47",
    "scipy>=1.11,<1.15",
    "rapidfuzz>=3.6,<3.11",
    "h3>=3.7,<4.0",
    "typer>=0.12,<0.16",
    "pyyaml>=6.0,<6.1",
    "matplotlib>=3.8,<3.10",
]

[project.optional-dependencies]
text = ["sentence-transformers>=2.6,<3.1"]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-xdist>=3.5,<4.0",
    "ruff>=0.5,<0.9",
    "mypy>=1.10,<1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poi_rank"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["N802", "N803", "N806"]

[tool.mypy]
strict = true
files = ["src/poi_rank"]

# pandas/yaml/h3/scipy/scikit-learn/shap ship no inline type stubs (or none we
# already depend on) and we're not adding types-PyYAML / pandas-stubs / scipy-stubs /
# sklearn-stubs as new dependencies for a stub-only gain (rule: don't install new
# deps without asking); ignore_missing_imports scopes the exemption to exactly these
# untyped third-party libs, not to poi_rank's own code. `sentence_transformers` is
# the optional text-embedding extra (`pyproject.toml`
# `[project.optional-dependencies] text`) -- not installed in the base env, so mypy
# cannot resolve it either; its only import site (`features/text_embed.py`) is
# inside a guarded `try/except ImportError`, never a hard runtime dependency. `shap`
# (Phase 7, `explain/shap_groups.py`) ships no `py.typed` marker either (verified
# directly against the installed package, not assumed).
[[tool.mypy.overrides]]
module = [
    "yaml",
    "pandas",
    "pandas.*",
    "h3",
    "scipy",
    "scipy.*",
    "sklearn",
    "sklearn.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "shap",
    "shap.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: heavy pipeline/training tests (session-scoped fixtures; run in the serial lane)",
]

[tool.coverage.report]
omit = ["notebooks/*"]
