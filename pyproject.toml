[project]
name = "poi-rank"
version = "0.1.0"
description = "Personalized POI intelligence & ranking system with non-circular synthetic evaluation"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.1,<2.3",
    "pyarrow>=15.0,<17.0",
    "scikit-learn>=1.4,<1.6",
    "lightgbm>=4.3,<4.6",
    "shap>=0.45,<0.47",
    "scipy>=1.11,<1.15",
    "rapidfuzz>=3.6,<3.11",
    "h3>=3.7,<4.0",
    "typer>=0.12,<0.16",
    "pyyaml>=6.0,<6.1",
    "matplotlib>=3.8,<3.10",
]

[project.optional-dependencies]
text = ["sentence-transformers>=2.6,<3.1"]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<0.9",
    "mypy>=1.10,<1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poi_rank"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["N802", "N803", "N806"]

[tool.mypy]
strict = true
files = ["src/poi_rank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.report]
omit = ["notebooks/*"]
